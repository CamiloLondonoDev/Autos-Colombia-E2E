name: E2E tests

# Triggered by the app repo (Parking-Management) after every successful deploy of main:
#   POST /repos/<owner>/Autos-Colombia-E2E/dispatches
#   {"event_type": "app-deployed", "client_payload": {"deployed_url": "https://..."}}
on:
  repository_dispatch:
    types: [app-deployed]
  workflow_dispatch:
    inputs:
      deployed_url:
        description: URL of the deployed app (e.g. https://<user>.github.io/Parking-Management/)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.client_payload.deployed_url || inputs.deployed_url }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.client_payload.deployed_url || inputs.deployed_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Show target
        run: echo "Testing $BASE_URL"

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
